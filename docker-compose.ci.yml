# Local stand-in for .gitlab-ci.yml jobs ruby::rubocop and ruby::rspec.
# Does not run ruby::rubygem (needs GEM_HOST_API_KEY).
#
#   docker compose -f docker-compose.ci.yml run --rm rubocop
#   docker compose -f docker-compose.ci.yml run --rm rspec
#
# Redis URL uses hostname `redis` (Compose DNS). GitLab sets
# redis://localhost:6379/1 because the job shares the service network.

x-rspec-environment: &rspec-environment
  DATABASE_HOST: postgres
  DATABASE_PASSWORD: TEST-insecure_password
  DATABASE_USERNAME: decidim
  DISABLED_DOCKER_COMPOSE: "true"
  TRAEFIK_REDIS_URL: redis://redis:6379/1
  DECIDIM_DEEPL_API_KEY: ci-test-deepl-key
  NODE_MAJOR: "18"
  SIMPLECOV: "1"
  CI: "1"

services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: decidim_test
      POSTGRES_USER: decidim
      POSTGRES_PASSWORD: TEST-insecure_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decidim -d decidim_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rubocop:
    image: ruby:3.2.2
    working_dir: /app
    volumes:
      - .:/app
    command:
      - bash
      - -lc
      - |
        set -e
        bundle
        bundle exec rubocop .

  rspec:
    image: ruby:3.2.2
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *rspec-environment
    command:
      - bash
      - -lc
      - |
        set -e
        apt-get update -qq && apt-get install -y ca-certificates curl gnupg build-essential libjpeg62-turbo-dev libwebp-dev libwebp7
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_18.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
        apt-get update && apt-get install -y -qq nodejs
        npm install -g yarn --force
        gem install bundler
        bundle config set path 'vendor'
        RAILS_ENV=development bundle install
        bundle pristine webp-ffi
        bundle exec rake test_app
        RAILS_ENV=test bundle exec rspec spec/models spec/forms spec/node_audit_spec.rb spec/lib spec/commands
